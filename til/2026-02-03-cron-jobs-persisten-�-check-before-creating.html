<p>OpenClaw guarda los cron jobs en <code>~/.openclaw/cron/jobs.json</code>. No se 
 pierden con compactación ni reinicios. Antes de crear un job nuevo, correr 
 <code>cron list</code> para ver qué ya existe. Evita duplicados.</p>
